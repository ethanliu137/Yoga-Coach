<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yoga Test</title>
  <style>
    :root {
      --bg: #2b2c29;
      --page: #20211f;
      --line: #4a4c46;
      --text: #f4f3ef;
      --muted: #c7c7bd;
      --subtle: #8d9088;
      --green: #2fd06f;
      --green-soft: #e8f8ee;
      --amber: #ffb31a;
      --danger: #ff6b5f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .app {
      width: min(930px, 100%);
      min-height: 720px;
      background: var(--bg);
      border: 1px solid #333431;
      padding: 28px 30px 40px;
      position: relative;
    }

    .menu {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 8px;
      background: #20211e;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
    }

    header {
      text-align: center;
      margin: 10px 0 42px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      line-height: 1.1;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(310px, 0.95fr);
      gap: 26px;
      align-items: start;
    }

    .video-wrap {
      height: 340px;
      border-radius: 11px;
      overflow: hidden;
      background: #030403;
      position: relative;
      display: grid;
      place-items: center;
    }

    video,
    #output {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    video {
      opacity: 1;
      pointer-events: none;
    }

    #output:not([src]),
    #output[src=""] {
      display: none;
    }

    .pose-badge {
      position: absolute;
      top: 14px;
      left: 15px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 0 16px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.72);
      font-weight: 800;
    }

    .camera-empty {
      z-index: 1;
      display: grid;
      gap: 8px;
      justify-items: center;
      color: #6f726b;
      font-weight: 700;
    }

    .camera-icon {
      width: 68px;
      height: 68px;
      border: 6px solid #262825;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 22px;
      color: #4f514c;
    }

    .countdown-ring {
      position: absolute;
      z-index: 3;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      display: none;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(0,0,0,.42) 0 57%, transparent 58%),
        conic-gradient(#ffffff var(--progress), rgba(255,255,255,.2) 0);
      box-shadow: 0 0 0 1px rgba(255,255,255,.18);
      font-size: 38px;
      font-weight: 900;
    }

    .countdown-ring.active { display: grid; }

    .encourage {
      position: absolute;
      z-index: 3;
      bottom: 26px;
      left: 24px;
      right: 24px;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.92);
      font-size: 20px;
      font-weight: 900;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 62px;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      height: 50px;
      border: 1px solid #666861;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { border-color: #8b8d85; background: rgba(255,255,255,.035); }

    .side {
      display: grid;
      gap: 18px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 24px 26px;
      background: rgba(255,255,255,.01);
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 16px;
      color: var(--muted);
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 18px;
      font-weight: 900;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--amber);
      flex: 0 0 auto;
    }

    .dot.ready { background: var(--green); }
    .dot.warn { background: var(--danger); }

    .live-readout {
      margin-top: 14px;
      color: var(--subtle);
      font-size: 13px;
      font-weight: 700;
    }

    .demo-img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: contain;
      border-radius: 8px;
      background: #171814;
      border: 1px solid #3f413b;
      display: block;
    }

    .score-box {
      display: grid;
      justify-items: center;
      gap: 6px;
      padding-top: 8px;
    }

    .score {
      font-size: 66px;
      line-height: .95;
      font-weight: 900;
    }

    .score-label {
      color: #f0dfc1;
      font-size: 17px;
      font-weight: 800;
    }

    .bar {
      width: 100%;
      height: 8px;
      margin-top: 10px;
      border-radius: 999px;
      background: #22231f;
      overflow: hidden;
    }

    .bar span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
      transition: width .2s ease;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      height: 32px;
      padding: 0 14px;
      border: 1px solid #4e504a;
      border-radius: 16px;
      color: #f1e3c9;
      background: #20211e;
      font-weight: 800;
      cursor: pointer;
    }

    .chip.active {
      color: #008747;
      background: var(--green-soft);
      border-color: #9ee9b9;
    }

    canvas { display: none; }

    @media (max-width: 820px) {
      body { padding: 10px; }
      .app { min-height: auto; padding: 24px 18px 28px; }
      .layout { grid-template-columns: 1fr; }
      .video-wrap { height: min(62vw, 340px); min-height: 260px; }
      .controls { margin-top: 18px; }
    }
    .model-badge {
      position: absolute;
      top: 58px;
      left: 15px;
      z-index: 2;
      min-height: 30px;
      padding: 0 14px;
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.72);
      color: #f0dfc1;
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="app">
    <button class="menu" aria-label="更多">...</button>
    <header>
      <h1>Yoga Test</h1>
      <p class="subtitle">即時瑜珈姿勢辨識與評分</p>
    </header>

    <section class="layout">
      <div>
        <div class="video-wrap">
          <div class="pose-badge"><span id="targetPose">Warrior</span></div>
          <div class="model-badge" id="modelBadge">Model：尚未偵測</div>
          <video id="video" autoplay playsinline muted></video>
          <img id="output" alt="" />
          <div class="camera-empty" id="emptyState">
            <div class="camera-icon">CAM</div>
            <div>等待攝影機準備</div>
          </div>
          <div class="countdown-ring" id="countdownRing" style="--progress: 0deg">10</div>
          <div class="encourage" id="encourage"></div>
        </div>

        <div class="controls">
          <button id="btn" onclick="toggleStream()">開始辨識</button>
          <button onclick="resetSession()" title="重新開始" aria-label="重新開始">↻</button>
        </div>
      </div>

      <aside class="side">
        <section class="panel">
          <h2>狀態</h2>
          <div class="status-line">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">尚未開始</span>
          </div>
          <div class="live-readout" id="liveReadout">偵測到 Warrior 後會自動倒數 10 秒</div>
        </section>

        <section class="panel">
          <h2>本次分數</h2>
          <div class="score-box">
            <div class="score" id="score">--</div>
            <div class="score-label" id="scorePose">Warrior</div>
            <div class="bar"><span id="scoreBar"></span></div>
          </div>
        </section>

        <section class="panel">
          <h2>示範姿勢</h2>
          <img class="demo-img" id="poseDemo" src="/static/poses/warrior.jpg" alt="Warrior 示範姿勢">
        </section>

        <section class="panel">
          <h2>支援姿勢</h2>
          <div class="chips" id="poseChips"></div>
        </section>
      </aside>
    </section>
  </main>

  <canvas id="canvas"></canvas>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const POSES = [
      { key: "warrior2", name: "Warrior", image: "/static/poses/warrior.jpg" },
      { key: "downdog", name: "Downdog", image: "/static/poses/downdog.jpg" },
      { key: "tree", name: "Tree", image: "/static/poses/tree.jpg" },
      { key: "goddess", name: "Goddess", image: "/static/poses/goddess.jpg" },
      { key: "plank", name: "Plank", image: "/static/poses/plank.jpg" },
    ];

    const HOLD_SECONDS = 10;
    const CONF_THRESHOLD = 0.6;
    const ENCOURAGEMENTS = ["加油，保持住", "很好，身體穩住", "呼吸放慢", "快完成了"];

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const output = document.getElementById("output");
    const emptyState = document.getElementById("emptyState");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const btn = document.getElementById("btn");
    const ctx = canvas.getContext("2d");
    const countdownRing = document.getElementById("countdownRing");
    const encourage = document.getElementById("encourage");
    const score = document.getElementById("score");
    const scorePose = document.getElementById("scorePose");
    const scoreBar = document.getElementById("scoreBar");
    const targetPose = document.getElementById("targetPose");
    const liveReadout = document.getElementById("liveReadout");
    const poseChips = document.getElementById("poseChips");
    const modelBadge = document.getElementById("modelBadge");
    const socket = io();

    let streaming = false;
    let interval = null;
    let selectedPose = POSES[0];
    let holdStartedAt = null;
    let samples = [];
    let completed = false;

    function renderPoseChips() {
      poseChips.innerHTML = "";
      POSES.forEach((pose) => {
        const chip = document.createElement("button");
        chip.className = "chip" + (pose.key === selectedPose.key ? " active" : "");
        chip.textContent = pose.name;
        chip.onclick = () => {
          selectedPose = pose;
          targetPose.textContent = pose.name;
          scorePose.textContent = pose.name;
          poseDemo.src = pose.image;
          poseDemo.alt = `${pose.name} 示範姿勢`;
          resetSession(false);
          renderPoseChips();
        };
        poseChips.appendChild(chip);
      });
    }

    function setStatus(text, mode = "waiting") {
      statusText.textContent = text;
      statusDot.className = "dot";
      if (mode === "ready") statusDot.classList.add("ready");
      if (mode === "warn") statusDot.classList.add("warn");
    }

    function resetSession(clearScore = true) {
      holdStartedAt = null;
      samples = [];
      completed = false;
      countdownRing.classList.remove("active");
      countdownRing.textContent = HOLD_SECONDS;
      countdownRing.style.setProperty("--progress", "0deg");
      encourage.textContent = "";
      if (clearScore) {
        score.textContent = "--";
        scoreBar.style.width = "0%";
      }
      setStatus(streaming ? "尋找指定姿勢中..." : "尚未開始");
      liveReadout.textContent = `偵測到 ${selectedPose.name} 後會自動倒數 ${HOLD_SECONDS} 秒`;
    }

    socket.on("connect", () => {
      setStatus("伺服器已連線", "ready");
    });

    socket.on("result_frame", (data) => {
      output.src = "data:image/jpeg;base64," + data.image;
      emptyState.style.display = "none";

      if (!streaming || completed) return;

      const label = data.label;
      const conf = Number(data.conf || 0);
      const displayName = data.display_name || label || "未偵測";
      const isTarget = label === selectedPose.key && conf >= CONF_THRESHOLD;
      modelBadge.textContent = label
        ? `Model：${displayName} ${(conf * 100).toFixed(1)}%`
        : "Model：未偵測";
      liveReadout.textContent = label
        ? `目前偵測：${displayName} ${(conf * 100).toFixed(1)}%`
        : "目前沒有偵測到人體";

      if (!holdStartedAt) {
        if (!isTarget) {
          setStatus(`請做出 ${selectedPose.name}`, "waiting");
          return;
        }
        holdStartedAt = performance.now();
        samples = [];
        setStatus("維持姿勢中...", "ready");
      }

      const elapsed = (performance.now() - holdStartedAt) / 1000;
      const remaining = Math.max(0, HOLD_SECONDS - elapsed);
      samples.push(isTarget ? conf : 0);

      countdownRing.classList.add("active");
      countdownRing.textContent = Math.ceil(remaining);
      countdownRing.style.setProperty("--progress", `${Math.min(360, (elapsed / HOLD_SECONDS) * 360)}deg`);
      encourage.textContent = ENCOURAGEMENTS[Math.min(ENCOURAGEMENTS.length - 1, Math.floor(elapsed / 3))];
      setStatus(isTarget ? "維持姿勢中..." : "姿勢跑掉了，快調回來", isTarget ? "ready" : "warn");

      if (remaining <= 0) {
        completed = true;
        const average = samples.reduce((sum, value) => sum + value, 0) / Math.max(samples.length, 1);
        const finalScore = Math.round(Math.max(0, Math.min(100, average * 100)));
        score.textContent = finalScore;
        scoreBar.style.width = `${finalScore}%`;
        scorePose.textContent = selectedPose.name;
        countdownRing.classList.remove("active");
        encourage.textContent = "完成！";
        setStatus("本組動作完成", "ready");
        liveReadout.textContent = `${selectedPose.name} 整體平均分數：${finalScore}`;
      }
    });

    async function startWebcam() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;

      await new Promise((resolve) => {
        video.onloadedmetadata = resolve;
      });

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      emptyState.style.display = "none";
    }

    function sendFrame() {
      if (!video.videoWidth || !video.videoHeight) return;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
      socket.emit("frame", { image: dataUrl.split(",")[1] });
    }

    async function toggleStream() {
      if (!streaming) {
        await startWebcam();
        streaming = true;
        resetSession();
        interval = setInterval(sendFrame, 100);
        btn.textContent = "停止辨識";
        setStatus(`請做出 ${selectedPose.name}`, "waiting");
      } else {
        clearInterval(interval);
        streaming = false;
        btn.textContent = "開始辨識";
        setStatus("已停止");
      }
    }

    renderPoseChips();
    resetSession();
  </script>
</body>
</html>
